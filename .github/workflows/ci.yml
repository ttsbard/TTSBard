name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  check-docs:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, statuses and artifacts
        shell: pwsh
        run: ./scripts/check-docs.ps1
      - name: Test bilingual documentation checks
        shell: pwsh
        run: ./scripts/tests/test-check-bilingual-docs.ps1

  check-third-party-notices:
    name: Check third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled notices and license mappings
        shell: pwsh
        run: ./scripts/check-third-party-notices.ps1

  check-model-catalog:
    name: Check model catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate model catalog schema and unit tests
        run: |
          python3 scripts/validate-model-catalog.py
          python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Verify catalog URLs when catalog changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run_url_check=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_url_check=true
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
              ! git diff --quiet "$BASE_SHA" HEAD -- catalog/model-catalog.json scripts/validate-model-catalog.py; then
            run_url_check=true
          fi
          if [[ "$run_url_check" == "true" ]]; then
            python3 scripts/validate-model-catalog.py --check-urls
          else
            echo "Skipping live URL check (catalog/model-catalog.json unchanged)."
          fi

  check-fmt:
    name: Check Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  check-clippy:
    name: Run Clippy linter
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run clippy
        shell: pwsh
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: >-
          & .\scripts\cargo.ps1 @('clippy', '--manifest-path',
          'src-tauri/Cargo.toml', '--locked', '--all-targets', '--all-features',
          '--', '-D', 'warnings')

  check-types:
    name: Check TypeScript types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check IPC contracts
        run: |
          npm run check:ipc
          npm run test:ipc
      - name: Check settings and speech contracts
        run: |
          npm run check:settings
          npm run test:settings
          npm run check:speech-contract
          npm run test:speech-contract
          npm run check:locales
          npm run test:locales
      - name: Run frontend tests
        run: npm test
      - name: Type check
        run: npm run build

  test-rust:
    name: Run Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare Piper test data
        shell: pwsh
        run: |
          .\scripts\cargo.ps1 build --manifest-path src-tauri/Cargo.toml --package espeak-rs-sys --locked
          $espeakData = Get-ChildItem `
            'src-tauri\target\debug\build\espeak-rs-sys-*\out\share\espeak-ng-data' `
            -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $espeakData) { throw 'compiled espeak-ng-data not found' }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'voices') -PathType Container)) {
            throw 'compiled espeak-ng-data is missing voices/'
          }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'lang') -PathType Container)) {
            throw 'compiled espeak-ng-data is missing lang/'
          }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'en_dict') -PathType Leaf)) {
            throw 'compiled espeak-ng-data is missing en_dict'
          }
          "PIPER_ESPEAKNG_DATA_DIRECTORY=$($espeakData.FullName)" >> $env:GITHUB_ENV
      - name: Run tests
        shell: pwsh
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: .\scripts\cargo.ps1 test --manifest-path src-tauri/Cargo.toml --locked --verbose

  bundle-smoke:
    name: Tauri bundle smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build Tauri debug app without installers
        shell: pwsh
        run: .\scripts\build.ps1 -Mode debug
