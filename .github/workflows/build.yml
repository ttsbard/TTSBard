name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  wait-for-ci:
    name: Wait for successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for CI on the tagged commit
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use the format MAJOR.MINOR.PATCH"
            exit 1
          fi

          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '.workflow_runs | map(select(.head_branch == "master" or .head_branch == "main")) | sort_by(.created_at) | last | .id // empty')

            if [[ -z "$run_id" ]]; then
              echo "CI for ${GITHUB_SHA} has not appeared yet; waiting..."
              sleep 15
              continue
            fi

            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty')
            url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.html_url')

            if [[ "$status" != "completed" ]]; then
              echo "CI is ${status}: ${url}"
              sleep 15
              continue
            fi

            if [[ "$conclusion" == "success" ]]; then
              echo "CI succeeded: ${url}"
              exit 0
            fi

            echo "CI concluded with '${conclusion}': ${url}"
            exit 1
          done

          echo "Timed out waiting for CI for ${GITHUB_SHA}"
          exit 1

  build:
    needs: wait-for-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match CI's VS 2022 toolchain for Piper's bundled eSpeak NG.
          - platform: windows-2022
            os: windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Match the Windows CI toolchain while native builds need the old Cargo layout.
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="$GITHUB_REF_NAME"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using tag version: $VERSION"
          else
            # Use default dev version for PRs and manual runs
            echo "VERSION=0.3.0-dev" >> $GITHUB_OUTPUT
            echo "Using dev version"
          fi
        shell: bash

      - name: Set version
        run: node scripts/set-version.cjs "${{ steps.get_version.outputs.VERSION }}" "${{ github.sha }}"

      - name: Verify native build tools
        shell: pwsh
        run: |
          cmake --version
          $libclang = @(
            'C:\Program Files\LLVM\bin\libclang.dll',
            'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\x64\bin\libclang.dll'
          ) | ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $libclang) { throw 'libclang.dll not found for espeak-rs-sys bindgen' }
          "LIBCLANG_PATH=$($libclang.DirectoryName)" >> $env:GITHUB_ENV
          Write-Host "Using $($libclang.FullName)"

      - name: Prepare Piper test data
        shell: pwsh
        run: |
          .\scripts\cargo.ps1 build --manifest-path src-tauri/Cargo.toml --package espeak-rs-sys --locked
          $espeakData = Get-ChildItem `
            'src-tauri\target\debug\build\espeak-rs-sys-*\out\share\espeak-ng-data' `
            -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $espeakData) { throw 'compiled espeak-ng-data not found' }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'voices') -PathType Container)) {
            throw 'compiled espeak-ng-data is missing voices/'
          }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'lang') -PathType Container)) {
            throw 'compiled espeak-ng-data is missing lang/'
          }
          if (-not (Test-Path (Join-Path $espeakData.FullName 'en_dict') -PathType Leaf)) {
            throw 'compiled espeak-ng-data is missing en_dict'
          }
          "PIPER_ESPEAKNG_DATA_DIRECTORY=$($espeakData.FullName)" >> $env:GITHUB_ENV

      - name: Build application
        shell: pwsh
        env:
          # Tauri updater signing key (ROADMAP-141). The private key lives in
          # GitHub Actions Secrets and never leaves the bundler; see
          # docs/development/github-actions-build.md for the setup.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $buildArgs = @('-Mode', 'release')
          $hasPrivateKey = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)
          if ($hasPrivateKey -ne $hasPublicKey) {
            throw 'Configure both TAURI_SIGNING_PRIVATE_KEY (secret) and TAURI_UPDATER_PUBLIC_KEY (variable) to enable signed updates.'
          }
          if ($hasPrivateKey) {
            $buildArgs += '-UpdaterArtifacts'
            Write-Host 'Updater signing key found: producing the installer and detached signature'
          } else {
            Write-Host '::warning::TAURI_SIGNING_PRIVATE_KEY is not configured; the release will not support in-app updates'
          }
          .\scripts\build.ps1 @buildArgs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-${{ matrix.target }}
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATER_SIGNING_CONFIGURED: ${{ vars.TAURI_UPDATER_PUBLIC_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify NSIS release assets
        run: |
          VERSION="$GITHUB_REF_NAME"
          SETUP=$(find artifacts -type f -name "TTSBard_${VERSION}_x64-setup.exe" -print -quit)
          if [[ -z "$SETUP" ]]; then
            echo "::error::NSIS installer artifact not found"
            exit 1
          fi
          if [[ ! -s "$SETUP.sig" ]]; then
            if [[ "$UPDATER_SIGNING_CONFIGURED" == 'true' ]]; then
              echo "::error::The signed release is missing its NSIS installer signature"
              exit 1
            fi
            echo "::warning::Publishing without an installer signature. In-app installation stays unavailable."
          fi

      # Publish only after the installers and any signatures are attached.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*-setup.exe.sig
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The app reads its update description from the GitHub release body.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="$GITHUB_REF_NAME"
          node scripts/make-update-manifest.cjs \
            --print-notes \
            --version "$VERSION" \
            --changelog CHANGELOG.md > artifacts/release-notes.md
          if [[ -s artifacts/release-notes.md ]]; then
            echo "Release notes: $(wc -c < artifacts/release-notes.md) chars from the v$VERSION section"
          else
            echo "::warning::CHANGELOG.md has no section for v$VERSION; prepare the version notes and rerun"
          fi

      # Idempotent on reruns: a body that already matches the section is left
      # alone, and an empty section never wipes an existing description.
      - name: Set release body from CHANGELOG section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! -s artifacts/release-notes.md ]]; then
            echo "::warning::No CHANGELOG section for ${GITHUB_REF_NAME}; the release body is left unchanged"
            exit 0
          fi
          CURRENT=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null || echo "")
          if [[ "$CURRENT" == "$(cat artifacts/release-notes.md)" ]]; then
            echo "Release body already matches the CHANGELOG section; nothing to update"
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file artifacts/release-notes.md

      - name: Publish release
        run:
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
