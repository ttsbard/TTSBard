[package]
name = "ttsbard"
version = "1.7.0"
description = "Fast text-to-speech for communication and streaming — for people with speech limitations and streamers"
authors = ["Aleksey Efimov"]
license = "GPL-3.0-only"
edition = "2021"

[lints.rust]
dead_code = "warn"
unused = "warn"

[lints.clippy]
todo = "warn"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ttsbard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = { version = "1", features = ["parallel"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1.0"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
thiserror = "1.0"
async-trait = "0.1"
axum = { version = "0.8" }
reqwest = { version = "0.12", features = ["json", "socks", "native-tls"] }
async-openai = { version = "0.33", features = ["chat-completion"] }
backoff = "0.4"
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"
dirs = "5"
flate2 = "1"
rodio = { version = "0.19", features = ["symphonia-mp3", "symphonia-wav"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "wav"] }
lewton = "0.10"
# DeepFilterNet real-time speech enhancement (native Rust inference via tract).
# NOTE: the package is `deep_filter` (in the libDF subdirectory) but its library
# target is named `df`, so it is imported in code as `df::tract::*`.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", features = ["tract", "default-model"] }
# ndarray must match the version used by deep_filter (^0.15) to share array types.
ndarray = "0.15"
# DeepFilterNet 0.5.7-pre uses APIs from tract 0.21.4; newer 0.21.x releases
# changed ndarray and graph APIs without a compatible DeepFilterNet release.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
image = "0.25"
xcap = "0.9"
regex = "1"
lazy_static = "1.4"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# WebView security
subtle = "2.6"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

# UPnP port forwarding
igd = "0.12"
# Active IPv4 interface enumeration for explicit SSDP binding. The `gateway`
# feature supplies Interface::gateway and NetworkDevice; other defaults are off.
netdev = { version = "0.46", default-features = false, features = ["gateway"] }

# Telegram client
# Using fork with MTProxy support from https://github.com/alksef/grammers-mtproxy
grammers-client = { git = "https://github.com/alksef/grammers-mtproxy", branch = "master", features = ["proxy"] }
grammers-session = { git = "https://github.com/alksef/grammers-mtproxy", branch = "master" }
grammers-mtsender = { git = "https://github.com/alksef/grammers-mtproxy", branch = "master", features = ["proxy", "mtproxy"] }
grammers-tl-types = { git = "https://github.com/alksef/grammers-mtproxy", branch = "master" }

# Time utilities
chrono = "0.4"

# Twitch IRC client (ROADMAP-104): transport + protocol lifecycle owned by the library
twitch-irc = { version = "=6.1.1", default-features = false, features = ["transport-tcp", "transport-tcp-native-tls"] }

# Twitch Helix + OAuth (ROADMAP-132). These are third-party twitch-rs community
# libraries, not an official Twitch SDK. The existing app networking stays on
# reqwest 0.12; the SDK only gets a narrowly scoped reqwest 0.13 transport
# (reqwest_twitch) with default SDK features disabled and no EventSub. We enable
# `client` (generic HTTP transport trait) + `helix` (typed request/response) and
# implement the transport ourselves so redirects/retries/timeouts stay under our
# control and secret forwarding is impossible.
twitch_api = { version = "=0.8.0", default-features = false, features = ["helix", "client"] }
twitch_oauth2 = { version = "=0.17.1", default-features = false, features = ["client"] }
reqwest_twitch = { package = "reqwest", version = "=0.13.4", default-features = false, features = ["native-tls"] }
# `http` types are shared by twitch_api/twitch_oauth2 and our transport adapter.
http = "1"

# VRChat OSC (ROADMAP-130)
rosc = "0.10"
unicode-segmentation = "1.13"

# Thread safety and rate limiting
parking_lot = "0.12"
governor = "0.6"

# Russian number to text conversion
russian_numbers = "0.2.0"

# Timing attack prevention
rand = "0.10"

# Offline spellcheck (Hunspell-compatible)
spellbook = "0.4"

# Piper TTS embedded runtime: static ONNX Runtime + phonemization
ort = { version = "=2.0.0-rc.13", features = ["half"] }
espeak-rs = { git = "https://github.com/alksef/piper-rs.git", rev = "346f10f6e8520b2ee21e4d0117c1ca0e38e5cd0f", package = "espeak-rs" }

# Pocket TTS local runtime (ROADMAP-135): ONNX graphs plus the two tokenizer
# formats used by the supported model packages.
half = "2.7.1"
tokenizers = { version = "0.22.2", default-features = false }
unicode-normalization = "0.1.25"

# PP-OCRv5 one-shot screen OCR backend (ROADMAP-088). Default features are off:
# no model downloader, no DirectML. Only the tokio worker wrapper is enabled.
rapidocr-core = { version = "0.2.2", default-features = false, features = ["tokio"] }

# Native RUAccent stress runtime (local sibling repository, see ROADMAP-082).
ruaccent_rs = { git = "https://github.com/alksef/ruaccent-rs.git", tag = "v0.3.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Globalization",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_Devices_Display",
    "Win32_UI_TextServices",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography"
] }

[features]
default = ["mtproxy"]
mtproxy = ["grammers-mtsender/mtproxy"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Workaround: duplicate node names generated during tract-pulse
# codegen/compaction for the DFN3 graph. Our local copy auto-deduplicates names.
[patch.crates-io]
tract-core = { path = "patches/tract-core" }

# espeak-rs-sys 0.2.0 conditionally links the incompatible Debug CRT from its
# build script when cfg(debug_assertions) is enabled. Disable that cfg only for
# this upstream package; application and test assertions remain enabled.
[profile.dev.package.espeak-rs-sys]
debug-assertions = false
